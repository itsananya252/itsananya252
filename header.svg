<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#16103a"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .rain { font-family: 'Courier New', monospace; font-size: 15px; fill: #7dd3fc; writing-mode: vertical-lr; text-orientation: upright; letter-spacing: 3px; animation: fall linear infinite; }
    .r1 { animation-duration: 9s;  animation-delay: -1s; opacity: .35; }
    .r2 { animation-duration: 12s; animation-delay: -6s; opacity: .22; }
    .r3 { animation-duration: 8s;  animation-delay: -3s; opacity: .40; }
    .r4 { animation-duration: 11s; animation-delay: -9s; opacity: .25; }
    .r5 { animation-duration: 10s; animation-delay: -2s; opacity: .32; }
    @keyframes fall { from { transform: translateY(-340px); } to { transform: translateY(330px); } }
    .mono { font-family: 'Courier New', 'Fira Code', monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(310px); } }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- falling code rain -->
  <text class="rain r1" x="30"  y="0">01{}&lt;/&gt;;=10</text>
  <text class="rain r2" x="95"  y="0">Spring@Boot</text>
  <text class="rain r3" x="160" y="0">1010&amp;&amp;||01</text>
  <text class="rain r4" x="235" y="0">public static</text>
  <text class="rain r5" x="310" y="0">0110{ }101</text>
  <text class="rain r2" x="385" y="0">SELECT * ;</text>
  <text class="rain r1" x="610" y="0">&lt;div&gt;/&gt;01</text>
  <text class="rain r4" x="690" y="0">Ollama::RAG</text>
  <text class="rain r3" x="765" y="0">10110010</text>
  <text class="rain r5" x="840" y="0">@Autowired</text>
  <text class="rain r2" x="915" y="0">git push -f</text>
  <text class="rain r1" x="965" y="0">=&gt; 0x7F</text>

  <rect width="1000" height="300" fill="url(#fade)"/>

  <!-- scan line -->
  <rect class="scan" width="1000" height="2" fill="#7dd3fc" opacity="0.18"/>

  <!-- window chrome -->
  <rect x="1" y="1" width="998" height="298" rx="10" fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="30" rx="10" fill="#0d1117" fill-opacity="0.85"/>
  <circle cx="24" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="16" r="6" fill="#27c93f"/>
  <text class="mono" x="500" y="21" fill="#7dd3fc" fill-opacity="0.7" font-size="13" text-anchor="middle">ananya@dev:~/portfolio</text>

  <!-- terminal content -->
  <text class="mono" x="60" y="95" font-size="20" fill="#7dd3fc">$ <tspan fill="#c9d1d9">whoami</tspan></text>

  <text x="500" y="170" text-anchor="middle" font-size="68" font-weight="700" font-family="'Courier New', monospace" fill="url(#name)" filter="url(#glow)">Ananya Dixit</text>

  <text class="mono" x="500" y="210" text-anchor="middle" font-size="20" fill="#7dd3fc">Full Stack Developer  •  Java &amp; Spring Boot  •  CS Student</text>

  <text class="mono" x="60" y="262" font-size="18" fill="#7dd3fc">$ <tspan fill="#c9d1d9" class="pulse">building, learning, shipping...</tspan><tspan fill="#7dd3fc" class="cursor"> █</tspan></text>
</svg>
